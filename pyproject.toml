[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-claim-audit"
version = "0.1.0"
description = "An offline static audit of documented third-party extensibility promises"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
plugin-claim-audit = "plugin_claim_audit.cli:main"

[tool.setuptools.packages.find]
include = ["plugin_claim_audit*"]
